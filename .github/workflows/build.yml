# Builds Windows (.vst3) and macOS (.vst3 + .component) plugins on every push,
# then publishes them as the "latest" release so they always live at a fixed link:
#   https://github.com/<you>/<repo>/releases/download/latest/Undertow-macOS-plugins.zip
# On a Mac, install-mac.sh downloads and installs that in one step.
# Every build is also kept as its own "build-N" release, so older versions stay downloadable.
name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Undertow-Windows
          - os: macos-latest
            name: Undertow-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, stage | Out-Null
          Copy-Item -Recurse build/Undertow_artefacts/Release/VST3/Undertow.vst3 stage/
          Copy-Item build/Undertow_artefacts/Release/Standalone/Undertow.exe stage/
          Compress-Archive -Path stage/* -DestinationPath out/Undertow-Windows-plugins.zip

      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir out stage
          cp -R build/Undertow_artefacts/Release/VST3/Undertow.vst3 stage/
          cp -R build/Undertow_artefacts/Release/AU/Undertow.component stage/
          cp -R build/Undertow_artefacts/Release/Standalone/Undertow.app stage/
          # Ad-hoc sign so Apple Silicon will load them
          codesign --force --deep --sign - stage/Undertow.vst3 stage/Undertow.component stage/Undertow.app
          # Zip with ditto so the executable bit inside the bundles survives
          ditto -c -k --sequesterRsrc stage out/Undertow-macOS-plugins.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest dist/Undertow-macOS-plugins.zip dist/Undertow-Windows-plugins.zip \
            --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Built automatically from ${GITHUB_SHA::7}. On a Mac, install with install-mac.sh (see README)."

      - name: Also keep this build as its own numbered release (older builds stay downloadable)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/Undertow-macOS-plugins.zip dist/Undertow-Windows-plugins.zip \
            --repo "$REPO" --target "$GITHUB_SHA" --latest=false \
            --title "Build ${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Archived build from commit ${GITHUB_SHA::7}."
